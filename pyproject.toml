[project]
name = "api-backend"
version = "1.4.0"
description = "FastAPI backend for The Foundry Project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.138.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.27",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "tqdm>=4.67.3",
    "valkey>=6.1.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PLE",
    "ASYNC", "DTZ", "LOG", "G", "C4", "RET", "PERF", "PTH", "S",
]

[tool.ruff.lint.per-file-ignores]
# Pydantic models mirroring the Dink RuneLite plugin's wire payload; the
# camelCase field names are the contract and cannot be renamed.
"app/routers/ironclad/_helpers.py" = ["N815"]
# assert is the point of a test.
"app/tests/**" = ["S101"]
# Config-table key names, not credential values.
"app/routers/config/_helpers.py" = ["S105"]
"app/services/competition_schedule/ballot_tokens.py" = ["S105"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: real-infra tests needing Postgres + Valkey containers (deselected by default)",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16",
    "testcontainers>=4.14.2",
    "tqdm>=4.68.3",
]

