# Wiki-page overrides for boss slugs whose humanized name is wrong, plus
# non-boss loot sources (activities, clues) that are not in the boss catalog.

# Mode-variant sources whose loot equals the base chest table are skipped here;
# they keep their EHB rates (sourced from WOM independently).
loot_exclude = [
    "chambers_of_xeric_challenge_mode",
    "theatre_of_blood_hard_mode",
    "tombs_of_amascut_expert",
]

# Sources whose rarities come from a reward chest (per completion / roll), not a
# per-kill drop table. Point-scaling (raid points, Barrows reward potential) is
# not modelled - the viewer labels these rather than converting per-kill.
chest_sources = [
    "chambers_of_xeric",
    "theatre_of_blood",
    "tombs_of_amascut",
    "barrows_chests",
    "sol_heredit",
    "wintertodt",
]

