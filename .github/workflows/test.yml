name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

  version:
    # Semantic versioning gate: a change to shipped code must bump the version
    # in pyproject.toml, which is the single source /version and the OpenAPI
    # info block both read. Docs- and CI-only changes are exempt.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump when shipped code changes
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          if [ -z "$changed" ]; then
            echo "No file changes."
            exit 0
          fi
          if ! printf '%s\n' "$changed" | grep -qvE '^(\.github/|.*\.md)$'; then
            echo "Only docs and CI changed - version bump not required."
            exit 0
          fi
          old=$(git show "$base:pyproject.toml" | grep -m1 '^version = ' | cut -d'"' -f2)
          new=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$old" = "$new" ]; then
            echo "::error::Shipped code changed but the version is still $new."
            echo "Bump it with: uv version --bump patch|minor (or alpha|beta|rc)."
            echo "A major bump is a maintainer decision - ask before making one."
            exit 1
          fi
          echo "Version bumped: $old -> $new"
